name: Daily Cybersecurity Code Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cyber-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate 10 Cybersecurity Scripts
        run: |
          git config --global user.name "sky360-tech"
          git config --global user.email "tahmirhasanraid1@gmail.com"

          for i in $(seq 1 10); do
            python "${{ github.workspace }}/.github/scripts/cyber_changer.py"
            git add security_tools/
            git commit -m "feat(security): add automated security utility module ($i/10)"
            sleep 1
          done

      - name: Push Code Updates
        run: |
          git pull --rebase origin main
          git push origin main
